name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/SHA to rollback to'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  FRONTEND_IMAGE: beeyield-frontend
  BACKEND_IMAGE: beeyield-backend

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.0.0

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
            NAMESPACE="beeyield-prod"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
            NAMESPACE="beeyield-staging"
          fi
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Rollback Deployment
        run: |
          VERSION="${{ github.event.inputs.version }}"

          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${VERSION} \
            -n $NAMESPACE
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${VERSION} \
            -n $NAMESPACE

          kubectl rollout status deployment/frontend -n $NAMESPACE
          kubectl rollout status deployment/backend -n $NAMESPACE

      - name: Verify Rollback
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            URL="https://beeyield.com"
          else
            URL="https://staging.beeyield.com"
          fi

          curl -f ${URL}/ || exit 1
          curl -f ${URL}/api/health || exit 1

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload: |
            text: "WARNING: emergency rollback to ${{ github.event.inputs.version }} completed for ${{ github.event.inputs.environment }} with status ${{ job.status }}"
        if: always()
