name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/SHA to rollback to'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: nduva15/beeyield-frontend
  BACKEND_IMAGE: nduva15/beeyield-backend

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
            NAMESPACE="beeyield-prod"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
            NAMESPACE="beeyield-staging"
          fi
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV

      - name: Rollback Deployment
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION} \
            -n ${{ env.NAMESPACE }}
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${VERSION} \
            -n ${{ env.NAMESPACE }}
          
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }}

      - name: Verify Rollback
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            URL="https://beeyield.com"
          else
            URL="https://staging.beeyield.com"
          fi
          
          curl -f ${URL}/health || exit 1
          curl -f ${URL}/api/health || exit 1

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '⚠️ Emergency rollback to ${{ github.event.inputs.version }} completed for ${{ github.event.inputs.environment }}'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
