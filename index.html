        <style>
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #ffffff;
                z-index: 9999;
                font-family: 'Outfit', sans-serif;

                    opacity: 0.6;
                    transform: scale(0.98);
                }

                    opacity: 1;
                    transform: scale(1);
                }

                    opacity: 0.6;
                    transform: scale(0.98);
                }
            }
        </style>
