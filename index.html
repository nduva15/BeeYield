<body>
    <div id="root">
        <!-- Persistent Splash Screen for Zero-Latency First Interaction -->
        <style>
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #FCFAF5;
                z-index: 9999;
                font-family: 'Outfit', sans-serif;
                transition: opacity 0.5s ease-out;
            }

            .splash-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                animation: fadeIn 0.8s ease-out forwards;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .loader-bar {
                width: 120px;
                height: 2px;
                background: rgba(27, 145, 87, 0.1);
                border-radius: 10px;
                overflow: hidden;
                position: relative;
            }

            .loader-progress {
                width: 40%;
                height: 100%;
                background: #1B9157;
                border-radius: 10px;
                position: absolute;
                animation: loading 1.5s ease-in-out infinite;
            }

            @keyframes loading {
                0% { left: -40%; }
                100% { left: 100%; }
            }
        </style>
        <div id="splash">
            <div class="splash-content">
                <img src="/logo.png" alt="BeeYield" style="width: 80px; height: auto;" />
                <h1 style="margin: 0; font-size: 24px; font-weight: 900; color: #1B9157; letter-spacing: -0.02em;">BeeYield</h1>
                <div class="loader-bar">
                    <div class="loader-progress"></div>
                </div>
            </div>
        </div>
    </div>
