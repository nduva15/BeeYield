[package]
name = "beeyield_core"
version = "0.1.0"
edition = "2021"
description = "BeeYield core logic engine — Rust compute layer exposed via PyO3"

[lib]
name = "beeyield_core"
crate-type = ["cdylib"]    # Shared library for Python

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
