[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "S", "B"]
ignore = ["E501", "S101", "S104", "S110", "S311", "B008", "B904", "B905", "B028", "B005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
