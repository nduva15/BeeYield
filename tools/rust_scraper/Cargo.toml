[package]
name = "beeyield_agentic_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "rustls-tls"] }
scraper = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.7"
futures = "0.3"
[package]
name = "beeyield_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
scraper = "0.14"
url = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
