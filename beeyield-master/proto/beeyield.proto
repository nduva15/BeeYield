syntax = "proto3";

package beeyield;

option go_package = "github.com/aggym/beeyield/beeyield-master/proto";

// The Control Plane (Go Master)
service Master {
  // Workers register themselves to the master
  rpc RegisterWorker (WorkerRegistration) returns (RegistrationResponse);
  // Heartbeat to keep the connection alive
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

// The Data Plane (Rust Ingestor)
service Ingestor {
  // Trigger a scrape task for a specific target
  rpc TriggerScrape (ScrapeRequest) returns (ScrapeResponse);
  // Stream status updates of the ingestion process
  rpc StreamIngestionStatus (IngestionStatusRequest) returns (stream IngestionUpdate);
}

// The Logic Plane (Python Inference/Brain)
service Inference {
  // Shop Insight: "Why should I buy this?"
  rpc GenerateShopInsight (ShopInsightRequest) returns (ShopInsightResponse);
  // Pollination ROI: "how much am I losing?"
  rpc CalculateROI (ROIRequest) returns (ROIResponse);
  // Smart Bundle: "What did I forget?"
  rpc RecommendBundle (BundleRequest) returns (BundleResponse);
}

message WorkerRegistration {
  string worker_id = 1;
  string worker_type = 2; // "rust-ingestor", "python-inference", "cpp-index"
  string capabilities = 3;
}

message RegistrationResponse {
  bool success = 1;
  string master_id = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
  string status = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message ScrapeRequest {
  string target_url = 1;
  string doc_type = 2; // "pdf", "html", "api"
  string metadata = 3; // JSON string
}

message ScrapeResponse {
  string task_id = 1;
  string status = 2;
}

message IngestionStatusRequest {
  string task_id = 1;
}

message IngestionUpdate {
  string task_id = 1;
  string status = 2;
  int32 progress_percent = 3;
  string error_message = 4;
}

message ShopInsightRequest {
  string user_id = 1;
  string product_id = 2;
  string user_location = 3;
  string user_context = 4; // JSON string
}

message ShopInsightResponse {
  string insight_text = 1;
  double yield_increase_percent = 2;
  string badge_type = 3; // "yield", "health", "savings"
}

message ROIRequest {
  string user_id = 1;
  string crop_type = 2;
  double acres = 3;
  int32 cur_hives = 4;
}

message ROIResponse {
  double current_revenue = 1;
  double potential_revenue = 2;
  double revenue_lost = 3;
  int32 optimal_hives = 4;
  string currency = 5;
}

message BundleRequest {
  repeated string cart_items = 1;
  string user_id = 2;
}

message BundleResponse {
  string missing_item_id = 1;
  string reason = 2;
  double discount_percent = 3;
}
