apiVersion: v1
kind: ConfigMap
metadata:
  name: beeyield-config
  namespace: beeyield
data:
  # Backend configuration
  PYTHONUNBUFFERED: "1"
  
  # Database configuration
  POSTGRES_DB: "beeyield"
  POSTGRES_USER: "postgres"
  
  # Redis configuration
  REDIS_HOST: "beeyield-redis"
  REDIS_PORT: "6379"
