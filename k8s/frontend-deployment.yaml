apiVersion: apps/v1
kind: Deployment
metadata:
  name: beeyield-frontend
  namespace: beeyield
  labels:
    app: beeyield-frontend
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: beeyield-frontend
  template:
    metadata:
      labels:
        app: beeyield-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: beeyield-frontend:latest  # Replace with your image registry/tag
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: beeyield-frontend
  namespace: beeyield
  labels:
    app: beeyield-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: beeyield-frontend
