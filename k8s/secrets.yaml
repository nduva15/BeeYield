apiVersion: v1
kind: Secret
metadata:
  name: beeyield-secrets
  namespace: beeyield
type: Opaque
stringData:
  # Database secrets
  POSTGRES_PASSWORD: "changeme-postgres-password"
  DATABASE_URL: "postgresql://postgres:changeme-postgres-password@beeyield-postgres:5432/beeyield"
  
  # Supabase secrets
  VITE_SUPABASE_URL: "https://your-project.supabase.co"
  VITE_SUPABASE_ANON_KEY: "your-supabase-anon-key"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_KEY: "your-supabase-anon-key"
  
  # API configuration
  VITE_API_URL: "https://api.beeyield.yourdomain.com"
