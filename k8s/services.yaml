apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: beeyield-prod
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
    version: blue  # Switch to 'green' for blue-green deployment
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: beeyield-prod
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
    version: blue  # Switch to 'green' for blue-green deployment
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: beeyield-prod
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: beeyield-prod
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
