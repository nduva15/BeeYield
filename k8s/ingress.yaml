apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beeyield-ingress
  namespace: beeyield
  annotations:
    # For nginx ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Enable CORS if needed
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # For cert-manager (optional - uncomment to enable TLS)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Change based on your ingress controller
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - beeyield.example.com
  #   - api.beeyield.example.com
  #   secretName: beeyield-tls
  rules:
  - host: beeyield.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beeyield-frontend
            port:
              number: 80
  - host: api.beeyield.example.com  # Replace with your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beeyield-backend
            port:
              number: 8000
