[package]
name = "beeyield-native-hive"
version = "1.0.0"
edition = "2021"
description = "BeeYield AI Native Hive — High-performance Chromium wrapper for honey traceability and precision pollination"
authors = ["BeeYield Team"]
license = "MIT"
rust-version = "1.77"

[lib]
name = "beeyield_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "beeyield-native-hive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri Core ──────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"

# ── Async Runtime ──────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── HTTP Client (for Gemini / OpenAI / Supabase calls) ────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Vector Search (in-process HNSW for 25k+ embeddings) ──
hnsw_rs = "0.3"
ndarray = "0.16"

# ── Hashing / Blockchain verification ─────────────────────
sha2 = "0.10"
hex = "0.4"

# ── Logging ────────────────────────────────────────────────
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# ── Error Handling ─────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ── Time ───────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── UUID for node IDs ─────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ── Dev Profile (fast iteration) ───────────────────────────
[profile.dev]
incremental = true   # Only recompile what changed
opt-level = 0        # Fastest compile time
debug = 0            # Disable debug symbols — massive speedup

[profile.dev.package."*"]
opt-level = 3        # Keep dependencies (hnsw_rs, reqwest, etc.) optimized

# ── Release Profile ───────────────────────────────────────
[profile.release]
lto = true           # Link-Time Optimization — smaller binary
codegen-units = 1    # Single codegen unit — max optimization
strip = true         # Strip debug symbols — ~5MB final binary
panic = "abort"      # No unwinding — smaller + faster
opt-level = "z"      # Optimize for size
