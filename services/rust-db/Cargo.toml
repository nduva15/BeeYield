[package]
name = "beeyield-db"
version = "1.0.0"
edition = "2021"
description = "BeeYield Database Service - High-performance Supabase REST client in Rust"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
tokenizers = "0.21"

